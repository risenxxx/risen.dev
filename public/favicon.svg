<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    risen.dev, abbreviated: the wordmark's own lowercase r and the dot that
    follows it, in the green the page keeps for the availability chip.

    Drawn as a path rather than set in Sora, because a favicon loads no fonts.
    The letter and the dot are centred together, not separately: the composite
    box measures 7.62 either side and the stem's x-height band sits on the
    tile's middle. The 0.35 lift off that middle is optical — the mark carries
    the stem's foot and the dot along its bottom and nothing at the top right,
    so a mathematically centred one reads as sinking.

    The arm overshoots the stem's top and the dot overshoots the baseline, both
    by a fraction, the way a round shape has to in order to look level with a
    flat one.
  -->
  <rect width="32" height="32" rx="8" fill="#0A0A0C"/>
  <path d="M7.62 6.94h5.49v3.62c1.61 -2.68 4.42 -4.15 8.04 -4.15h1.74v5.76h-2.14c-4.82 0 -7.64 2.95 -7.64 7.91V24.36h-5.49z" fill="#F5F5F7"/>
  <circle cx="20.89" cy="21.28" r="3.48" fill="#5BD8A6"/>
</svg>
