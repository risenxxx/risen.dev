<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 512 512">
  <!--
    The touch icon again, for mail (BIMI): the logo an inbox draws beside a
    message from any @risen.dev address. The profile is SVG Tiny PS, which
    is what the BIMI record may point to: a title, no transforms to be on
    the safe side, nothing external. So touch.svg's group is baked into the
    coordinates here. The mark is drawn at 0.78 of the square rather than
    the touch icon's 0.62: an inbox shows it at 40 px or less, and 0.78
    still keeps it inside the circle every inbox crops a logo to.
  -->
  <title>risen.dev</title>
  <rect width="512" height="512" fill="#0b0d0b"/>
  <path d="M93.76 288.45c22.46-57.41 63.65-57.41 88.61-19.97s61.15 37.44 86.11-19.97" fill="none" stroke="#e6e8e3" stroke-width="37.44" stroke-linecap="square" stroke-linejoin="round"/>
  <rect x="318.4" y="156.16" width="87.36" height="199.68" fill="#f2b63d"/>
</svg>
